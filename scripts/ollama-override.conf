# /etc/systemd/system/ollama.service.d/override.conf
#
# GEHARDEND t.o.v. het origineel: OLLAMA_HOST staat nu op 127.0.0.1
# in plaats van 0.0.0.0. Ollama had voorheen geen authenticatie en
# stond letterlijk open voor het hele internet. Als iets buiten deze
# host bij Ollama moet kunnen, doe dat via een reverse proxy met auth
# ervoor (bv. via nginx), nooit door dit terug te zetten naar 0.0.0.0.
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_NUM_PARALLEL=4"
Environment="OLLAMA_MAX_LOADED_MODELS=3"
Environment="OLLAMA_MAX_QUEUE=512"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_SCHED_SPREAD=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
